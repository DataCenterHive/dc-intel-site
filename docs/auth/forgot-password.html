<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | DataCenter Hive</title>
    <link rel="icon" type="image/png" href="../9e224nbi.png">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-default: #e2e8f0;
            --border-emphasis: #cbd5e1;
            --brand-primary: #2563eb;
            --brand-hover: #1d4ed8;
            --success: #059669;
            --danger: #ef4444;
            --spacing-unit: 8px;
            --r-sm: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-secondary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-primary);
            padding: calc(var(--spacing-unit) * 2.5);
            font-size: 16px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--bg-primary);
            padding: calc(var(--spacing-unit) * 5);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1), 0 1px 2px rgba(15, 23, 42, 0.06);
            border-radius: var(--r-sm);
        }

        .logo {
            text-align: center;
            margin-bottom: calc(var(--spacing-unit) * 4);
        }

        .logo img {
            max-width: 180px;
            height: auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: calc(var(--spacing-unit) * 1);
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: calc(var(--spacing-unit) * 4);
        }

        .form-group {
            margin-bottom: calc(var(--spacing-unit) * 2.5);
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: calc(var(--spacing-unit) * 1);
        }

        .form-input {
            width: 100%;
            padding: calc(var(--spacing-unit) * 1.5);
            border: 2px solid var(--border-default);
            border-radius: var(--r-sm);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-primary);
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--brand-primary);
        }

        .btn {
            width: 100%;
            padding: calc(var(--spacing-unit) * 1.5) calc(var(--spacing-unit) * 3);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border-radius: var(--r-sm);
            transition: all 0.2s ease;
            display: inline-block;
            border: 2px solid var(--brand-primary);
            background: var(--brand-primary);
            color: #ffffff;
        }

        .btn:hover {
            background: var(--brand-hover);
            border-color: var(--brand-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
            margin-top: calc(var(--spacing-unit) * 3);
        }

        .back-link:hover {
            color: var(--brand-primary);
        }

        .banner {
            padding: calc(var(--spacing-unit) * 2);
            border-radius: var(--r-sm);
            margin-bottom: calc(var(--spacing-unit) * 3);
            font-size: 14px;
            line-height: 1.6;
            border-width: 2px;
            border-style: solid;
        }

        .banner-success {
            background: #f0fdf4;
            border-color: var(--success);
            color: #14532d;
        }

        .banner-error {
            background: #fef2f2;
            border-color: var(--danger);
            color: #7f1d1d;
        }

        .banner strong {
            font-weight: 600;
        }

        .success-container {
            display: none;
            text-align: center;
        }

        .success-container.active {
            display: block;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: calc(var(--spacing-unit) * 2);
        }

        .form-container.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="../9e224nbi.png" alt="DataCenter Hive">
        </div>

        <div id="bannerContainer"></div>

        <!-- Form Container -->
        <div class="form-container" id="formContainer">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>

            <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="your@email.com"
                        required
                        autocomplete="email">
                </div>

                <button type="submit" class="btn" id="submitBtn">Send Reset Link</button>
            </form>

            <a href="javascript:history.back()" class="back-link">← Back</a>
        </div>

        <!-- Success Container -->
        <div class="success-container" id="successContainer">
            <div class="success-icon">✅</div>
            <h1>Check Your Email</h1>
            <p class="subtitle">
                If an account exists with that email, we've sent password reset instructions.
                Please check your inbox and spam folder.
            </p>
            <p class="subtitle" style="margin-top: calc(var(--spacing-unit) * 2);">
                The reset link will expire in 15 minutes.
            </p>
            <a href="../index.html" class="back-link" style="display: inline-block; margin-top: calc(var(--spacing-unit) * 4);">
                ← Back to Home
            </a>
        </div>
    </div>

    <script>
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://127.0.0.1:8010' : 'https://dc-intel-api.onrender.com';

        function getBasePath() {
            return location.hostname.endsWith('github.io') && location.pathname.includes('/dc-intel-site/')
                ? '/dc-intel-site/'
                : '/';
        }

        function showBanner(type, message) {
            const container = document.getElementById('bannerContainer');
            const banner = document.createElement('div');
            banner.className = `banner banner-${type}`;
            banner.innerHTML = message;
            container.innerHTML = '';
            container.appendChild(banner);
        }

        function clearBanner() {
            document.getElementById('bannerContainer').innerHTML = '';
        }

        async function handleForgotPassword(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            // Validate email
            if (!email) {
                showBanner('error', '<strong>Validation Error:</strong> Please enter your email address.');
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            clearBanner();

            try {
                // Call backend API
                const response = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                // Always show success message (don't leak whether email exists)
                // This is a security best practice to prevent email enumeration
                if (response.ok || response.status === 404) {
                    // Hide form, show success
                    document.getElementById('formContainer').classList.add('hidden');
                    document.getElementById('successContainer').classList.add('active');
                } else {
                    // Server error
                    throw new Error('Unable to process request. Please try again later.');
                }

            } catch (error) {
                console.error('Forgot password error:', error);
                showBanner('error', `<strong>Error:</strong> ${error.message}`);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        }
    </script>
</body>
</html>
