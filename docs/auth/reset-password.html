<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DataCenter Hive</title>
    <link rel="icon" type="image/png" href="../9e224nbi.png">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-default: #e2e8f0;
            --border-emphasis: #cbd5e1;
            --brand-primary: #2563eb;
            --brand-hover: #1d4ed8;
            --success: #059669;
            --danger: #ef4444;
            --warning: #d97706;
            --spacing-unit: 8px;
            --r-sm: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-secondary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-primary);
            padding: calc(var(--spacing-unit) * 2.5);
            font-size: 16px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--bg-primary);
            padding: calc(var(--spacing-unit) * 5);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1), 0 1px 2px rgba(15, 23, 42, 0.06);
            border-radius: var(--r-sm);
        }

        .logo {
            text-align: center;
            margin-bottom: calc(var(--spacing-unit) * 4);
        }

        .logo img {
            max-width: 180px;
            height: auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: calc(var(--spacing-unit) * 1);
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: calc(var(--spacing-unit) * 4);
        }

        .form-group {
            margin-bottom: calc(var(--spacing-unit) * 2.5);
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: calc(var(--spacing-unit) * 1);
        }

        .form-input {
            width: 100%;
            padding: calc(var(--spacing-unit) * 1.5);
            border: 2px solid var(--border-default);
            border-radius: var(--r-sm);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-primary);
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--brand-primary);
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: calc(var(--spacing-unit) * 0.5);
        }

        .btn {
            width: 100%;
            padding: calc(var(--spacing-unit) * 1.5) calc(var(--spacing-unit) * 3);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border-radius: var(--r-sm);
            transition: all 0.2s ease;
            display: inline-block;
            border: 2px solid var(--brand-primary);
            background: var(--brand-primary);
            color: #ffffff;
        }

        .btn:hover:not(:disabled) {
            background: var(--brand-hover);
            border-color: var(--brand-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
            margin-top: calc(var(--spacing-unit) * 3);
            width: 100%;
            text-align: center;
            justify-content: center;
        }

        .back-link:hover {
            color: var(--brand-primary);
        }

        .banner {
            padding: calc(var(--spacing-unit) * 2);
            border-radius: var(--r-sm);
            margin-bottom: calc(var(--spacing-unit) * 3);
            font-size: 14px;
            line-height: 1.6;
            border-width: 2px;
            border-style: solid;
        }

        .banner-success {
            background: #f0fdf4;
            border-color: var(--success);
            color: #14532d;
        }

        .banner-error {
            background: #fef2f2;
            border-color: var(--danger);
            color: #7f1d1d;
        }

        .banner-warning {
            background: #fffbeb;
            border-color: var(--warning);
            color: #78350f;
        }

        .banner strong {
            font-weight: 600;
        }

        .success-container {
            display: none;
            text-align: center;
        }

        .success-container.active {
            display: block;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: calc(var(--spacing-unit) * 2);
        }

        .form-container.hidden {
            display: none;
        }

        .password-requirements {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: calc(var(--spacing-unit) * 1);
            padding-left: calc(var(--spacing-unit) * 2);
        }

        .password-requirements li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="../9e224nbi.png" alt="DataCenter Hive">
        </div>

        <div id="bannerContainer"></div>

        <!-- Form Container -->
        <div class="form-container" id="formContainer">
            <h1>Create New Password</h1>
            <p class="subtitle">Enter a new password for your account.</p>

            <form id="resetPasswordForm" onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label class="form-label" for="newPassword">New Password</label>
                    <input
                        type="password"
                        id="newPassword"
                        class="form-input"
                        placeholder="Enter new password"
                        required
                        minlength="8"
                        autocomplete="new-password">
                    <ul class="password-requirements">
                        <li>At least 8 characters long</li>
                        <li>Include at least one uppercase letter</li>
                        <li>Include at least one number</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-input"
                        placeholder="Confirm new password"
                        required
                        minlength="8"
                        autocomplete="new-password">
                </div>

                <button type="submit" class="btn" id="submitBtn">Reset Password</button>
            </form>
        </div>

        <!-- Success Container -->
        <div class="success-container" id="successContainer">
            <div class="success-icon">✅</div>
            <h1>Password Reset Successful</h1>
            <p class="subtitle">
                Your password has been successfully reset. You can now log in with your new password.
            </p>
            <a href="login.html" class="btn" style="margin-top: calc(var(--spacing-unit) * 4);">
                Go to Login
            </a>
        </div>
    </div>

    <script>
        const API_BASE = 'https://dc-intel-api.onrender.com';

        function getBasePath() {
            return location.hostname.endsWith('github.io') && location.pathname.includes('/dc-intel-site/')
                ? '/dc-intel-site/'
                : '/';
        }

        function showBanner(type, message) {
            const container = document.getElementById('bannerContainer');
            const banner = document.createElement('div');
            banner.className = `banner banner-${type}`;
            banner.innerHTML = message;
            container.innerHTML = '';
            container.appendChild(banner);
        }

        function clearBanner() {
            document.getElementById('bannerContainer').innerHTML = '';
        }

        // Get token from URL query parameter
        function getResetToken() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token');
        }

        // Validate token exists on page load
        window.addEventListener('DOMContentLoaded', function() {
            const token = getResetToken();

            // DEBUG: Log the full URL to console
            console.log('Current URL:', window.location.href);
            console.log('Token found:', token ? 'YES' : 'NO');
            console.log('Token value:', token || '(missing)');

            if (!token) {
                // Show detailed error message
                const currentUrl = window.location.href;
                const hasToken = currentUrl.includes('token=');

                let errorMessage = '<strong>Invalid Reset Link</strong><br><br>';

                if (!hasToken) {
                    errorMessage += 'The reset link is missing the security token. This could mean:<br>';
                    errorMessage += '• The email link was incomplete<br>';
                    errorMessage += '• The token was stripped by email security<br>';
                    errorMessage += '• The backend sent an incorrect link<br><br>';
                    errorMessage += '<strong>Current URL:</strong><br>';
                    errorMessage += `<code style="font-size: 11px; word-break: break-all;">${currentUrl}</code><br><br>`;
                    errorMessage += 'Please request a new reset link.';
                } else {
                    errorMessage += 'The reset link has expired or is invalid.<br><br>';
                    errorMessage += 'Please request a new reset link.';
                }

                showBanner('error', errorMessage);
                document.getElementById('resetPasswordForm').style.display = 'none';

                // Add a button to go back to forgot password
                const formContainer = document.getElementById('formContainer');
                const backBtn = document.createElement('a');
                backBtn.href = '../auth/forgot-password.html';
                backBtn.className = 'btn';
                backBtn.style.marginTop = '20px';
                backBtn.style.display = 'block';
                backBtn.textContent = 'Request New Reset Link';
                formContainer.appendChild(backBtn);
            }
        });

        function validatePassword(password) {
            // At least 8 characters
            if (password.length < 8) {
                return 'Password must be at least 8 characters long';
            }

            // At least one uppercase letter
            if (!/[A-Z]/.test(password)) {
                return 'Password must include at least one uppercase letter';
            }

            // At least one number
            if (!/[0-9]/.test(password)) {
                return 'Password must include at least one number';
            }

            return null;
        }

        async function handleResetPassword(event) {
            event.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const token = getResetToken();
            const submitBtn = document.getElementById('submitBtn');

            clearBanner();

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                showBanner("error", "<strong>Passwords Don't Match:</strong> Please make sure both passwords are identical.");
                return;
            }

            // Validate password strength
            const validationError = validatePassword(newPassword);
            if (validationError) {
                showBanner('error', `<strong>Weak Password:</strong> ${validationError}`);
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            try {
                // Call backend API
                const response = await fetch(`${API_BASE}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword
                    })
                });

                if (!response.ok) {
                    const error = await response.json();

                    // Handle specific error cases
                    if (response.status === 400 && error.detail && error.detail.includes('expired')) {
                        throw new Error('This reset link has expired. Please request a new one.');
                    } else if (response.status === 400 && error.detail && error.detail.includes('used')) {
                        throw new Error('This reset link has already been used. Please request a new one.');
                    } else if (response.status === 404) {
                        throw new Error('Invalid reset link. Please request a new one.');
                    }

                    throw new Error(error.detail || 'Failed to reset password');
                }

                // Success - show success container
                document.getElementById('formContainer').classList.add('hidden');
                document.getElementById('successContainer').classList.add('active');

            } catch (error) {
                console.error('Reset password error:', error);
                showBanner('error', `<strong>Error:</strong> ${error.message}`);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        }
    </script>
</body>
</html>
